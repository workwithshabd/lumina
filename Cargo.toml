[package]
name = "atihsrah"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Atihsrah Contributors"]
description = "Secure, self-hosted image optimization proxy in Rust"

[dependencies]
axum = "0.8"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
moka = { version = "0.12", features = ["future"] }
governor = "0.8"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
ulid = "1.2"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
url = "2.5"
percent-encoding = "2.3"
ipnet = "2.12"
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace"] }
image = { version = "0.25", features = ["jpeg", "png", "webp", "avif"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
crc32fast = "1.4"
