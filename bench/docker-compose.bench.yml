services:
  origin:
    image: python:3.12-alpine
    container_name: bench_origin
    working_dir: /app
    volumes:
      - ../benchmarks/corpus:/benchmarks/corpus:ro
      - .:/app/bench:ro
    command: ["python3", "/app/bench/mock_origin.py", "8000", "--tls"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  atihsrah:
    image: atihsrah:latest
    container_name: bench_atihsrah
    depends_on:
      - origin
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./certs/ca.crt:/etc/ssl/certs/origin-ca.crt:ro
    ports:
      - "8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      - ATIHSRAH_BIND=0.0.0.0:8080
      - ATIHSRAH_METRICS_BIND=0.0.0.0:9090
      - ALLOWED_ORIGINS=https://images.unsplash.com
      - ATIHSRAH_PRIVATE_ORIGINS=https://origin:8000,https://127.0.0.1:8000,https://localhost:8000
      - ATIHSRAH_PRIVATE_CA_FILE=/etc/ssl/certs/origin-ca.crt
      - ATIHSRAH_AUTH_MODE=signed
      - ATIHSRAH_SIGNING_KEY=9f8e7d6c5b4a3928172635445566778899aabbccddeeff001122334455667788
      - MAX_CONCURRENT_TRANSFORMS=4
      - CACHE_MAX_SIZE_MB=500
      - CACHE_SINGLE_ENTRY_MAX_MB=25
      - MAX_SOURCE_FETCH_MB=25
      - RATE_LIMIT_PER_MINUTE=100000
      - RATE_LIMIT_MISS_PER_MINUTE=10000
      - LOG_LEVEL=warn
      - ATIHSRAH_DEBUG_HEADERS=true

  imgproxy:
    image: darthsim/imgproxy:${IMGPROXY_VERSION:-v3.27.0}
    container_name: bench_imgproxy
    depends_on:
      - origin
    restart: unless-stopped
    volumes:
      - ./certs/ca.crt:/etc/ssl/certs/ca.crt:ro
    ports:
      - "8081:8080"
    environment:
      - IMGPROXY_CONCURRENCY=4
      - IMGPROXY_DOWNLOAD_TIMEOUT=15
      - IMGPROXY_MAX_SRC_RESOLUTION=33.5
      - IMGPROXY_ALLOW_LOCAL_ADDRESSES=true
      - IMGPROXY_LOG_LEVEL=warn
      - SSL_CERT_FILE=/etc/ssl/certs/ca.crt

  imgproxy_cached:
    image: nginx:alpine
    container_name: bench_imgproxy_cached
    depends_on:
      - imgproxy
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx-cache.conf:/etc/nginx/conf.d/default.conf:ro
