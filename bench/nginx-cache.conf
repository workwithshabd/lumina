proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=imgproxy_cache:10m max_size=500m inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://imgproxy:8080;
        proxy_cache imgproxy_cache;
        # Vary cache key on Accept header matching client format negotiation
        proxy_cache_key "$request_uri $http_accept";
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Proxied-By "nginx-imgproxy-cache";
    }

    location /health {
        proxy_pass http://imgproxy:8080/health;
    }
}

